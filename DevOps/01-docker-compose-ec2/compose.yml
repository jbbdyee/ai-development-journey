name: mini-agent-03-mcp

x-backend-environment: &backend-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  TRAVEL_MCP_URL: http://mcp-travel:8010/mcp
  HEALTH_MCP_URL: http://mcp-health:8011/mcp

services:
  frontend:
    image: jbbdyee/mini-agent-03-frontend:latest
    environment:
      BACKEND_API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: jbbdyee/mini-agent-03-backend:latest
    environment: *backend-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-travel:
        condition: service_healthy
      mcp-health:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_agent}
      POSTGRES_USER: ${POSTGRES_USER:-mini_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-travel:
    image: jbbdyee/mini-agent-03-mcp:latest
    command: ["python", "mcp_server/travel_server.py"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8010
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8010),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  mcp-health:
    image: jbbdyee/mini-agent-03-mcp:latest
    command: ["python", "mcp_server/health_server.py"]
    environment:
      HEALTH_MCP_HOST: 0.0.0.0
      HEALTH_MCP_PORT: 8011
    ports:
      - "8011:8011"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',8011),2); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
