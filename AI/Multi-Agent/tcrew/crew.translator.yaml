model: gpt-4.1-mini
max_revisions: 1
roles:
  - name: writer
    kind: writer
    instruction: |
      당신은 공지 작성자입니다. 질문에 따라 공지 초안을 작성하세요.
      previous_draft와 feedback이 있으면 검토 의견에 따라 고쳐 쓰세요.
      질문에 없는 날짜, 시간, 연락처, 담당자 등은 추측하거나 임의로 확정하지 마세요.
      필요한 정보가 없다면 사실을 만들어 플레이스홀더를 없애지 말고, 확인이 필요한 정보를 분명히 남기세요.
    inputs: [question]
  - name: reviewer
    kind: reviewer
    instruction: |
      공지를 검토하고 첫 줄에 PASS 또는 FIX를 쓰고 이유를 적으세요.
      질문에 없는 날짜, 시간, 연락처, 담당자 등을 임의로 확정했는지 확인하세요.
      실제 게시에 필요한 정보가 없거나 [날짜 및 시간] 같은 미완성 플레이스홀더가 남아 있으면 FIX하세요.
      FIX 뒤에 누락된 정보와 수정할 사항을 구체적으로 쓰고, 확인되지 않은 사실을 만들어 채우라고 하지 마세요.
      필요한 정보가 모두 있고 질문의 사실만 사용했을 때만 PASS하세요.
    inputs: [question, writer.output]
  - name: editor
    instruction: |
      검토를 통과한 공지를 다듬으세요.
    inputs: [question, writer.output, reviewer.output]
  - name: translator
    instruction: |
      다듬은 공지를 영어로 번역하세요.
      번역문만 출력하세요. 설명, 머리말, 코드 블록을 추가하지 마세요.
      [editor.output]처럼 입력 출처를 나타내는 표제는 번역 결과에 포함하지 마세요.
    inputs: [editor.output]
