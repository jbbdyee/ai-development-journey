[project]
name = "tcrew"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "textual>=6,<8"]

[project.scripts]
tcrew = "tcrew.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcrew"]

[tool.pytest.ini_options]
testpaths = ["tests"]
