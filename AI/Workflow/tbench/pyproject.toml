[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tbench"
version = "0.1.0"
description = "A terminal benchmark tool for HTTP webhooks"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "textual>=0.80,<8"]

[project.scripts]
tbench = "tbench.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/tbench"]
