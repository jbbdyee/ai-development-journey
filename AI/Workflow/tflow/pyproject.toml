[project]
name = "tflow"
version = "0.1.0"
description = "Read n8n workflow structure in a terminal"
requires-python = ">=3.11"
dependencies = ["textual>=0.80,<9"]

[project.scripts]
tflow = "tflow.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tflow"]
